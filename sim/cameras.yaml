# Simulated camera fleet. Source of truth for compose/cameras.generated.yml:
# edit this file, then run `uv run python sim/gen_compose.py` (or scripts/sim-up.sh).
#
# clip: file under media/ (normalized to camera profile v1, see docs/camera-profile.md;
# run ./scripts/fetch_media.sh and sim/scripts/normalize.sh first).
# Convention: gop = 2 x fps (2 s GOP); the generator warns otherwise.
#
# Every camera publishes a main stream (rtsp://mediamtx:8554/<id>, recording) and, unless
# `sub: null`, a sub stream (<id>-sub, detection + live view) from one ffmpeg process.
# A camera's `sub:` mapping overrides single fields of defaults.sub; sub gop defaults to 2 x fps.
# osd: burn "YYYY-MM-DD HH:MM:SS UTC" (top-left) and the camera id (bottom-right) into the pixels.
version: 2

defaults:
  image: shinobi-sim-camera:local
  build: ./sim/camera
  preset: veryfast
  transport: tcp
  osd: true
  sub:
    width: 640
    height: 360
    fps: 10
    bitrate: 384k

cameras:
  - id: cam-gate
    role: gate
    clip: gate_santos_port.mp4
    width: 1280
    height: 720
    fps: 15
    bitrate: 2M
    gop: 30

  - id: cam-quay
    role: quay
    clip: quay_sts_truck_loading.mp4
    width: 1280
    height: 720
    fps: 15
    bitrate: 4M
    gop: 30

  - id: cam-yard
    role: yard
    clip: yard_malta_freeport.mp4
    width: 1280
    height: 720
    fps: 10
    bitrate: 1.5M
    gop: 20

  - id: cam-waterway
    role: waterway
    clip: waterway_porpoise_bay.mp4
    width: 1280
    height: 720
    fps: 10
    bitrate: 3M
    gop: 20
