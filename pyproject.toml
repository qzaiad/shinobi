[project]
name = "shinobi-port-twin"
version = "0.0.0"
description = "Simulated port cameras -> Shinobi -> evaluator -> digital twin"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# -m "not e2e": a plain `pytest` never needs the stack; `pytest -m e2e` overrides it.
addopts = ["--import-mode=importlib", "--strict-markers", "-m", "not e2e"]
markers = [
    "integration: needs local tools such as ffmpeg/ffprobe, no running stack",
    "e2e: needs the running docker compose stack",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PLW1514"]  # PLW1514: explicit encoding= on open()/Path text I/O
preview = true
explicit-preview-rules = true  # enable only preview rules listed by exact code
